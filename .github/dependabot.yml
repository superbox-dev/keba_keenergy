version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
