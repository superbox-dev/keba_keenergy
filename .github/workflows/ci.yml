name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 30 5 * * *
  push:
    branches:
      - main
      - develop
    tags:
      - v*

jobs:
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Format check python files with ruff
        run: uv run ruff format --check $(git ls-files '*.py')
      - name: Type check python files with ty
        run: uv run ty check $(git ls-files '*.py')
      - name: Lint python files with ruff
        run: uv run ruff check $(git ls-files '*.py')
      - name: Lint YAML files
        run: uv run yamllint $(git ls-files '*.yml' '*.yaml')
      - name: Lint Markdown files
        run: uv run rumdl check $(git ls-files '*.md')

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        run: ./scripts/docs.sh

  validation:
    name: Validation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration

  security:
    name: Audit packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Audit python packages
        run: uv audit
      - name: Audit npm packages
        working-directory: website
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Run tests
        run: uv run pytest -n auto
      - name: Create coverage badge
        run: uv run genbadge coverage --input-file coverage.xml
      - name: Upload coverage badge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-badge
          path: coverage-badge.svg
          if-no-files-found: error
          overwrite: True

  coverage:
    name: Generate coverage badge
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type != 'tag'
    needs:
      - tests
    permissions:
      contents: write
    steps:
      # This job has write access to the repository, so it installs and runs no dependencies.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download coverage badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-badge
          path: .
      - name: Commit and push coverage badge
        run: |
          if git diff --quiet -- coverage-badge.svg; then
            echo "Coverage badge unchanged"
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage-badge.svg
          git commit -m "Updated coverage-badge.svg"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - code-analysis
      - validation
      - tests
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "🟡 Pre-release detected"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "🟢 Regular release"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release notes
        env:
          PRERELEASE: ${{ steps.check_prerelease.outputs.prerelease }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          HEADING="$(grep -m 1 -F "## [${VERSION}]" CHANGELOG.md | sed 's/^## //' || true)"

          if [[ -n "$HEADING" ]]; then
            # Same anchor as GitHub: lowercase, without punctuation, spaces as hyphens.
            ANCHOR="$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | tr -d -c 'a-z0-9 _-' | tr ' ' '-')"
          elif [[ "$PRERELEASE" == "true" ]]; then
            ANCHOR="unreleased"
          else
            echo "::error::No section for ${VERSION} in CHANGELOG.md"
            exit 1
          fi

          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/CHANGELOG.md#${ANCHOR}"
          echo "See the [changelog](${URL}) for all changes." > release-notes.md
          cat release-notes.md
      - name: Create ZIP file
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/keba_keenergy"
          zip -r "${GITHUB_WORKSPACE}/keba_keenergy.zip" ./
      - name: Release on GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          body_path: release-notes.md
          files: ${{ github.workspace }}/keba_keenergy.zip
      - name: Delete old pre-releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            while read -r TAG; do
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ || "$TAG" == "$TAG_NAME" ]]; then
                continue
              fi

              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "Deleting pre-release and tag $TAG"
                gh release delete "$TAG" --yes --cleanup-tag
              else
                echo "Deleting tag $TAG"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              fi
            done
