name: CI

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
    tags:
      - v*

jobs:
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Format check python files with ruff
        run: uv run ruff format --check $(git ls-files '*.py')
      - name: Type check python files with ty
        run: uv run ty check $(git ls-files '*.py')
      - name: Lint python files with ruff
        run: uv run ruff check $(git ls-files '*.py')
      - name: Lint YAML files
        run: uv run yamllint $(git ls-files '*.yml' '*.yaml')
      - name: Lint Markdown files
        run: uv run rumdl check $(git ls-files '*.md')

  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master
      - name: Run HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Run tests
        run: uv run pytest -n auto
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          overwrite: True

  coverage:
    name: Generate coverage badge
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    needs:
      - tests
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
          path: .
      - name: Create coverage badge
        run: uv run genbadge coverage --input-file coverage.xml
      - name: Verify coverage badge changed
        uses: tj-actions/verify-changed-files@v20
        id: changed-files
        with:
          files: coverage-badge.svg
      - name: Commit coverage badge
        if: steps.changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage-badge.svg
          git commit -m "Updated coverage-badge.svg"
      - name: Push changes
        if: steps.changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - code-analysis
      - validation
      - security
      - tests
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "🟡 Pre-release detected"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "🟢 Regular release"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release notes
        env:
          PRERELEASE: ${{ steps.check_prerelease.outputs.prerelease }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          HEADING="$(grep -m 1 -F "## [${VERSION}]" CHANGELOG.md | sed 's/^## //' || true)"

          if [[ -n "$HEADING" ]]; then
            # Same anchor as GitHub: lowercase, without punctuation, spaces as hyphens.
            ANCHOR="$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | tr -d -c 'a-z0-9 _-' | tr ' ' '-')"
          elif [[ "$PRERELEASE" == "true" ]]; then
            ANCHOR="unreleased"
          else
            echo "::error::No section for ${VERSION} in CHANGELOG.md"
            exit 1
          fi

          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/CHANGELOG.md#${ANCHOR}"
          echo "See the [changelog](${URL}) for all changes." > release-notes.md
          cat release-notes.md
      - name: Create ZIP file
        run: |
          cd ${{ github.workspace }}/custom_components/keba_keenergy
          zip -r ${{ github.workspace }}/keba_keenergy.zip ./
      - name: Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          body_path: release-notes.md
          files: ${{ github.workspace }}/keba_keenergy.zip
      - name: Delete old pre-releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            while read -r TAG; do
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ || "$TAG" == "$TAG_NAME" ]]; then
                continue
              fi

              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "Deleting pre-release and tag $TAG"
                gh release delete "$TAG" --yes --cleanup-tag
              else
                echo "Deleting tag $TAG"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              fi
            done
