line-length = 120

[lint]
select = ["ALL"]
# Rules that the numpy convention would turn off, but that the code already follows
extend-select = ["D107", "D212", "D402", "D413", "D417"]
ignore = [
  "COM812",  # missing-trailing-comma, conflicts with the formatter
  "FIX002",  # line-contains-todo, TODOs mark planned cleanups
  "TD002",   # missing-todo-author, TODOs have no author
  "TD003",   # missing-todo-link, TODOs need no issue
]

[lint.per-file-ignores]
"tests/*" = [
  "S101",    # assert, pytest checks results with assert
]

[lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow types with runtime checks (e.g. `isinstance`) or generics"

[lint.isort]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"
